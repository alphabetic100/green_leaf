name: green_leaf
description: "This is a application to calculate the carbon emission of your Office or Home."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8

  #State management 
  get: ^4.7.2

  #Flutter svg
  flutter_svg:

  #google fonts
  google_fonts: ^6.2.1

  #Otp boxes
  pinput: ^5.0.1

  #Firebase dependencies
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6

  #Google sign in 
  google_sign_in: ^6.3.0

  #Facebook sign in
  flutter_facebook_auth: ^7.1.1

  #local storage service
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0



flutter:

  uses-material-design: true


  assets:
  #Image directory
    - assets/images/
  #Icon directory
    - assets/icons/